services:
  - type: web
    name: aethel-api
    env: rust
    region: oregon
    plan: starter
    dockerfilePath: ./crates/backend/Dockerfile
    healthCheckPath: /api/v1/health
    numInstances: 1
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SUPABASE_REF
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: PORT
        value: "8080"
