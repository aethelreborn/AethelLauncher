name: Release

on:
  push:
    tags: ['v*']

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: aethel-launcher
            format: tar
            artifact: aethel-launcher-linux-x86_64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: aethel-launcher.exe
            format: zip
            artifact: aethel-launcher-windows-x86_64.zip
          - os: macos-latest
            target: x86_64-apple-darwin
            binary: aethel-launcher
            format: tar
            artifact: aethel-launcher-macos-x86_64.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: aethel-launcher
            format: tar
            artifact: aethel-launcher-macos-aarch64.tar.gz
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build launcher
        run: cargo build --locked --release --target ${{ matrix.target }} -p launcher-bin
      - name: Package Unix artifact
        if: matrix.format == 'tar'
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/${{ matrix.binary }}"
          tar -czf "dist/${{ matrix.artifact }}" -C dist "${{ matrix.binary }}"
      - name: Package Windows artifact
        if: matrix.format == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" dist
          Compress-Archive -Path "dist/${{ matrix.binary }}" -DestinationPath "dist/${{ matrix.artifact }}" -Force
      - uses: softprops/action-gh-release@v1
        with:
          files: dist/${{ matrix.artifact }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-manifest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate update manifest
        run: |
          echo "{\"version\":\"${{ github.ref_name }}\",\"url\":\"https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/aethel-launcher-linux-x86_64.tar.gz\"}" > update-manifest.json
      - uses: softprops/action-gh-release@v1
        with:
          files: update-manifest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
