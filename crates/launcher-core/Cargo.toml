[package]
name = "launcher-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
tokio = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true }
sha1 = "0.10"
md-5 = { workspace = true }
rand = { workspace = true }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "migrate", "postgres"] }
rusqlite = { version = "0.32", default-features = false, features = ["bundled"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["tokio-rustls", "rustls-tls-native-roots"] }
self_update = { version = "0.41", default-features = false, features = ["archive-tar", "compression-flate2", "rustls"] }
sentry = { version = "0.34", default-features = false, features = ["tracing", "rustls"] }
dirs = { version = "5", default-features = false }
parking_lot = { version = "0.12", default-features = false }
futures-util = { workspace = true }
hex = { workspace = true }
chrono = { workspace = true }
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = { version = "1", default-features = false }
walkdir = { version = "2", default-features = false }
urlencoding = "2"

[dev-dependencies]
tempfile = "3"
toml = "0.8"
percent-encoding = "2"
sha1 = "0.10"
